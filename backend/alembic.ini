# Alembic configuration. Run from backend/, as the owner role:
#
#   uv run alembic upgrade head            # build the schema in an empty database
#   uv run alembic check                   # models and schema agree
#   uv run python -m scripts.check_schema  # the database was built from these models
#
# The schema has one revision, migrations/versions/0001_baseline.py, which builds it from
# the models. A change to a model is followed by a wipe and a rebuild (make reset).
#
# There is no sqlalchemy.url and no logging section here: migrations/env.py takes the
# connection and the log level from Settings (the repository's .env), so credentials
# and tunables stay in one place (golden rule 7).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
