# Alembic configuration. Run from backend/, as the owner role:
#
#   uv run alembic upgrade head            # build the schema, or take a database to it
#   uv run alembic check                   # models and schema agree
#   uv run python -m scripts.check_schema  # the database has the schema of these models
#
# migrations/versions/0001_baseline.py is the schema as it was first deployed. A change
# to a model comes with the revision that takes a database there: `make revision
# NAME=...` writes its file from migrations/script.py.mako, numbered after the last one.
#
# There is no sqlalchemy.url and no logging section here: migrations/env.py takes the
# connection and the log level from Settings (the repository's .env), so credentials
# and tunables stay in one place (golden rule 7).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
