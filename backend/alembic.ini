# Alembic configuration. Run from backend/, as the owner role:
#
#   uv run alembic upgrade head
#   uv run alembic check                               # models and schema agree
#   uv run alembic revision --autogenerate -m "..."    # then read the generated file
#
# There is no sqlalchemy.url and no logging section here: migrations/env.py takes the
# connection and the log level from Settings (the repository's .env), so credentials
# and tunables stay in one place (golden rule 7).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# A generated revision is linted and formatted like the rest of the code.
hooks = ruff_fix, ruff_format

ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
