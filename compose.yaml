# MarkETH stack (SPEC §9, A.10): nginx in front of web and api, Postgres as the only
# source of truth, Redis and ScyllaDB as optional speed-ups.
#
# This file alone is the deployed stack: built images, no source mounts, and nginx as the
# only published port. `make deploy` runs exactly this on the VM, behind the VIScon
# portal, which signs every visitor in (docs/SERVER_INFRASTRUCTURE.md).
#
#   docker compose up --build     as deployed
#   make up                       development: compose.dev.yaml is merged in and adds
#                                 hot reload, ports and a stand-in for the portal's
#                                 sign-in
#
# No file here has a name Compose merges by itself, so the development overlay is part
# of a stack only where a command names it.
#
# Every value comes from .env (copy .example.env). Compose reads it to fill the ${...}
# below, and the Python services receive the whole file through env_file. A variable
# that is missing stops Compose instead of falling back to a default.

name: marketh

# Docker keeps a container's output without limit unless told otherwise. Every service
# rotates it: files of CONTAINER_LOG_MAX_SIZE, CONTAINER_LOG_MAX_FILES of them.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:?}
    max-file: "${CONTAINER_LOG_MAX_FILES:?}"

# Inside the stack the stores are reached by service name on their standard ports,
# whatever .env publishes them as on the host.
x-stores: &stores
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SCYLLA_HOSTS: scylla
  SCYLLA_PORT: "9042"

# api, relay and migrate run the same image with a different command, and each gets the
# whole of .env. What is built on this block connects as the app role and is handed an
# empty password for the owner role; migrate, the one service that works as the owner,
# takes its environment without that line.
x-backend: &backend
  build:
    context: ./backend
    target: prod
  init: true
  env_file: .env
  environment:
    <<: *stores
    POSTGRES_PASSWORD: ""
  logging: *logging

# The schema must be in place; Redis and ScyllaDB are deliberately absent, because the
# API and the relay start and keep working without them (SPEC §9).
x-needs-schema: &needs-schema
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

# Each service has a hard memory limit from .env: the VM has 7.6 GiB and no swap, and a
# leak should restart one container instead of starving the host.
#
# nginx and api also have their limit of open files from .env, the two containers whose
# open connections grow with the number of people in the room. Without the line a
# container has whatever the Docker daemon of its host hands out.
#
# Each service also names its networks (they are at the end of this file): nginx is on
# both, the web app on `edge` alone, everything else on `core` alone.
#
# One service names none: the media box, which has no network at all. The API reaches
# it through a Unix socket and the proxy reads the files it writes, each on one of the
# two volumes that are memory (under `volumes:` below).
services:
  # Waits for nobody: it resolves web and api per request and answers /api/ with a JSON
  # 503 while the API starts.
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:?}
    # A request the proxy passes on is two connections it holds, one to the client and
    # one upstream, and an open event stream holds its two for as long as it lasts.
    ulimits:
      nofile:
        soft: ${NGINX_NOFILE_LIMIT:?}
        hard: ${NGINX_NOFILE_LIMIT:?}
    logging: *logging
    networks:
      - edge
      - core
    environment:
      # Every time the container starts, the image renders each *.template below
      # /etc/nginx/templates to the same path below this directory. Only placeholders
      # named NGINX_* are replaced, so nginx's own $variables survive.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^NGINX_
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:?}
      NGINX_RATE_LIMIT: ${NGINX_RATE_LIMIT:?}
      NGINX_RATE_LIMIT_BURST: ${NGINX_RATE_LIMIT_BURST:?}
      NGINX_SSE_READ_TIMEOUT: ${NGINX_SSE_READ_TIMEOUT:?}
      NGINX_SSE_STREAMS_PER_CALLER: ${NGINX_SSE_STREAMS_PER_CALLER:?}
      # Live video. The largest piece a broadcaster sends and the seconds a "yes, this
      # caller may watch" is remembered are settings of the API, handed to the proxy
      # under names of its own: the two have to agree.
      NGINX_BROADCAST_UPLOADS_PER_CALLER: ${NGINX_BROADCAST_UPLOADS_PER_CALLER:?}
      NGINX_BROADCAST_CHUNK_MAX_BYTES: ${BROADCAST_CHUNK_MAX_BYTES:?}
      NGINX_BROADCAST_ACCESS_CACHE_SECONDS: ${BROADCAST_ACCESS_CACHE_SECONDS:?}
      NGINX_CONTENT_SECURITY_POLICY: ${NGINX_CONTENT_SECURITY_POLICY:?}
      # The `edge` network as it is defined at the end of this file. The proxy answers
      # nothing under /api/ to a peer on it other than its gateway.
      NGINX_EDGE_SUBNET: ${EDGE_SUBNET:?}
      NGINX_EDGE_GATEWAY: ${EDGE_GATEWAY:?}
    volumes:
      # infra/nginx/conf.d is rendered to /etc/nginx/conf.d, which the image's nginx.conf
      # loads. The directory is mounted, never a single file: a mounted file stays the
      # one it was when the container was created, a mounted directory shows a replaced
      # file to the next start.
      - type: bind
        source: ./infra/nginx/conf.d
        target: /etc/nginx/templates/conf.d
        read_only: true
        bind:
          create_host_path: false
      # The playlist and the segments of a live stream, as the media box writes them.
      # The proxy serves them from here and writes nothing.
      - media-hls:/var/lib/marketh/hls:ro
    ports:
      - "${NGINX_HTTP_BIND:?}:${NGINX_HTTP_PORT:?}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend
      target: prod
    init: true
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:?}
    logging: *logging
    networks:
      - edge
    healthcheck:
      # Healthy when the app answers its start page with anything but a server error.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then((answer) => process.exit(answer.status < 500 ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    <<: *backend
    # The image's command plus a limit on how long a stop waits for requests in flight.
    # An open event stream never ends by itself: without the limit every restart would
    # last until Docker kills the process.
    #
    # uvicorn writes no access log. Its line holds the whole request line, query string
    # included, and a query can hold a name an admin searches for. The access log of the
    # stack is the proxy's, which leaves the query out.
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-access-log
      - --timeout-graceful-shutdown
      - "${API_SHUTDOWN_TIMEOUT_SECONDS:?}"
    restart: unless-stopped
    mem_limit: ${API_MEMORY_LIMIT:?}
    # One process serves the API, and every open event stream is a socket it holds,
    # beside its connections to Postgres and the requests in flight.
    ulimits:
      nofile:
        soft: ${API_NOFILE_LIMIT:?}
        hard: ${API_NOFILE_LIMIT:?}
    networks:
      - core
    # The directory of the media box's socket (BROADCAST_MEDIA_SOCKET). Read-only:
    # connecting to a socket writes nothing to the file system it lies in. The API does
    # not wait for the box; without it a live stream does not start and everything else
    # works.
    volumes:
      - media-socket:/run/marketh-media:ro
    depends_on: *needs-schema
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # No port and no healthcheck: a crash ends the process and the restart policy brings it
  # back, and a backlog shows as unpublished outbox rows.
  relay:
    <<: *backend
    command: ["python", "-m", "app.relay"]
    restart: unless-stopped
    mem_limit: ${BACKEND_WORKER_MEMORY_LIMIT:?}
    networks:
      - core
    depends_on: *needs-schema

  # One-shot, as the owner role. It builds the schema in an empty database and takes an
  # existing one through the revisions it has not seen, then proves that the database at
  # hand has the schema of the models of this code. A model that changed without a
  # revision fails here, before api and relay start: it needs one (`make revision`).
  migrate:
    <<: *backend
    # Where the stores are and nothing else, so the owner role's password is the one
    # .env holds.
    environment: *stores
    command:
      - sh
      - -c
      - alembic upgrade head && alembic check && python -m scripts.check_schema
    restart: "no"
    mem_limit: ${BACKEND_WORKER_MEMORY_LIMIT:?}
    networks:
      - core
    depends_on:
      postgres:
        condition: service_healthy

  # The media box (backend/mediabox): ffmpeg behind a supervisor. It turns the pieces a
  # broadcaster sends into the playlist and the segments people watch. ffmpeg reads
  # bytes a person chose, so the box is built as the place where somebody may one day
  # run code of their own: no network at all, a read-only root, no capability, no
  # memory shared with anything, a ceiling on its processes, its memory and its share
  # of the CPUs, and an environment of the fifteen variables below. It has no env_file:
  # no password and no admin of .env is in it.
  #
  # The API hands it the pieces through a Unix socket on a volume the two share, and
  # the proxy reads what it writes on a second one. Nobody waits for it: without the
  # box the stack starts and trades, and a live stream does not start.
  #
  # No `init`: the supervisor has to be process 1. The kernel delivers neither SIGKILL
  # nor SIGSTOP to the first process of a container from inside it, so nothing ffmpeg
  # is made to run can end or freeze it. The process ends by itself when its last live
  # stream has ended, and the restart policy brings an empty box back: whatever one
  # live stream did to the container, the next one starts in another.
  media:
    build:
      context: ./backend/mediabox
    restart: unless-stopped
    network_mode: none
    read_only: true
    # A read-only root alone leaves /dev/shm a memory disk the container may write.
    ipc: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${MEDIA_PIDS_LIMIT:?}
    mem_limit: ${MEDIA_MEMORY_LIMIT:?}
    cpus: ${MEDIA_CPUS:?}
    # If the host itself runs out of memory, video goes first: before the price history.
    oom_score_adj: 800
    logging: *logging
    environment:
      BROADCAST_MEDIA_SOCKET: ${BROADCAST_MEDIA_SOCKET:?}
      BROADCAST_MAX_LIVE: ${BROADCAST_MAX_LIVE:?}
      BROADCAST_MAX_MINUTES: ${BROADCAST_MAX_MINUTES:?}
      BROADCAST_STALL_SECONDS: ${BROADCAST_STALL_SECONDS:?}
      BROADCAST_CHUNK_MAX_BYTES: ${BROADCAST_CHUNK_MAX_BYTES:?}
      BROADCAST_INPUT_MAX_WIDTH: ${BROADCAST_INPUT_MAX_WIDTH:?}
      BROADCAST_INPUT_MAX_HEIGHT: ${BROADCAST_INPUT_MAX_HEIGHT:?}
      BROADCAST_VIDEO_HEIGHT: ${BROADCAST_VIDEO_HEIGHT:?}
      BROADCAST_VIDEO_FPS: ${BROADCAST_VIDEO_FPS:?}
      BROADCAST_VIDEO_KBPS: ${BROADCAST_VIDEO_KBPS:?}
      BROADCAST_AUDIO_KBPS: ${BROADCAST_AUDIO_KBPS:?}
      BROADCAST_HLS_SEGMENT_SECONDS: ${BROADCAST_HLS_SEGMENT_SECONDS:?}
      BROADCAST_HLS_PLAYLIST_SEGMENTS: ${BROADCAST_HLS_PLAYLIST_SEGMENTS:?}
      MEDIA_FFMPEG_THREADS: ${MEDIA_FFMPEG_THREADS:?}
      MEDIA_X264_PRESET: ${MEDIA_X264_PRESET:?}
    volumes:
      # The directory of BROADCAST_MEDIA_SOCKET, and where the box writes a live stream.
      - media-socket:/run/marketh-media
      - media-hls:/var/lib/marketh/hls
    healthcheck:
      # Asks the socket for the box's status. In the second between the end of its last
      # live stream and the restart the box answers nothing.
      test: ["CMD", "python", "-m", "mediabox.probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:?}
    # If the host itself runs out of memory, the store that holds the balances goes last.
    oom_score_adj: -500
    logging: *logging
    networks:
      - core
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Since Postgres 18 the image keeps its data in a per-major subdirectory
      # (/var/lib/postgresql/18/docker), so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP on purpose: while the image initialises a database it runs a temporary
      # server on the Unix socket only, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Limits, caches and pub/sub only (SPEC §9), so nothing is persisted.
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:?}
    logging: *logging
    networks:
      - core
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      # Read by `make redis-cli` to open the database the app uses.
      REDIS_DB: ${REDIS_DB:?}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2026.1 is ScyllaDB's long-term-support line; the image is built for arm64 and amd64.
  # The four flags are the ones SPEC §9 names; how many shards and how much memory is
  # for .env to say.
  #
  # SCYLLA_MEMORY is what ScyllaDB itself is told to use, in its own spelling: 2G or
  # 2048M, capital letter. It does not start with 2g. SCYLLA_MEMORY_LIMIT is the
  # container's limit and has to leave room for it. Of what the container may use,
  # ScyllaDB sets 1.5 GiB aside for everything that is not its own, and on top of that
  # what the kernel of the host keeps free (vm.min_free_kbytes: 44 MiB under Docker
  # Desktop, 66 MiB on the VM). It refuses to start unless what remains is at least
  # SCYLLA_MEMORY: "insufficient physical memory". The share set aside is where the
  # processes around it live, and the Python process each cqlsh check starts.
  # backend/tests/unit/test_stack_files.py holds the two values to that rule.
  #
  # A ScyllaDB that refused does not end its container. The image's supervisor gives up on
  # it and keeps running, so Docker restarts nothing and shows the container as
  # "unhealthy"; the reason is in its log.
  scylla:
    image: scylladb/scylla:2026.1
    restart: unless-stopped
    mem_limit: ${SCYLLA_MEMORY_LIMIT:?}
    # Price history is the part the product works without: first to go.
    oom_score_adj: 500
    logging: *logging
    networks:
      - core
    command:
      - --smp
      - ${SCYLLA_SMP:?}
      - --memory
      - ${SCYLLA_MEMORY:?}
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres-data:
  scylla-data:
  # The two volumes of the media box are memory: no picture and no sound of a live
  # stream reaches a disk, and both are empty again once their containers are gone.
  # Each belongs to the user of the box (10001, backend/mediabox/Dockerfile).
  #
  # The socket: the group of the API's image (1000, backend/Dockerfile) may enter the
  # directory and nobody else. The box tells a peer of its own user nothing but its
  # status, so the two users have to differ.
  media-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,mode=0750,uid=10001,gid=1000"
  # Playlists and segments: the box writes, everybody may read, which is how the proxy
  # serves them.
  media-hls:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=${MEDIA_HLS_TMPFS_SIZE:?},mode=0755,uid=10001,gid=10001"

# Two networks, so that the web app shares one with the proxy and with nothing else. It
# serves the same pages to everybody and needs neither the API nor a store, so it cannot
# open a connection to any of them: Redis and ScyllaDB ask for no password, and the API
# takes its caller from two request headers.
#
# The networks alone do not keep the web app from the API. The proxy listens on `edge`
# as well, and under /api/ it hands a request on with the two headers it came with. So
# the proxy itself refuses /api/ to a peer on `edge`: that is why this network has a
# fixed address range, which the proxy is told (infra/nginx/conf.d). The gateway, the
# address the host has on the network, is not refused. Depending on how Docker passes
# on what arrives on the published port, the proxy sees it coming from the gateway of
# one of its two networks, and which of the two is Docker's choice.
networks:
  # nginx and web.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?}
          gateway: ${EDGE_GATEWAY:?}
  # nginx, the API and what the API works with.
  core:
