# The checks behind "finish with `make lint` and `make test` green" (CLAUDE.md), run on
# every pull request and on main. Deploying is .github/workflows/deploy.yml. The ScyllaDB tests are slow and stay deselected, as
# they are in a plain `uv run pytest`.
#
# The jobs run on the team's own runner, which is the VM that serves the app
# (docs/SERVER_INFRASTRUCTURE.md): one runner, so one job at a time, beside the running
# stack and on its Docker. No job starts, stops or reads that stack, and none needs a
# secret: .example.env is a complete development environment. The runner's user has no
# sudo, so a tool the VM lacks comes as an action or as an image.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Install exactly what uv.lock says and never rewrite it.
  UV_FROZEN: "1"

jobs:
  backend:
    name: Backend
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.x"
          working-directory: backend
      # Settings has no defaults (CLAUDE.md, rule 7); the template is a complete
      # development environment.
      - name: Create .env from the template
        run: cp .example.env .env
        working-directory: .
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      # The integration tests start Postgres and Redis through Testcontainers, on the
      # runner's Docker.
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # compose.yaml is what the VM runs (SPEC A.10). This job proves that the files a
  # deployment is made of fit together: the scripts parse cleanly, both compose variants
  # resolve with the development environment and keep the web app and the owner role's
  # password where they belong, the production environment renders from the committed
  # layers, compose.yaml resolves with it, and nginx accepts the proxy configuration of
  # each of the three.
  stack:
    name: Stack
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the template
        run: cp .example.env .env
      # The VM has no shellcheck; its image reads the scripts from the checkout.
      - name: shellcheck accepts the deployment scripts
        run: |
          docker run --rm --network none --volume "$PWD/infra/deploy:/mnt:ro" koalaman/shellcheck:v0.10.0 \
            --shell=sh backup.sh check.sh smoke.sh
      - name: The deployment targets expand
        run: make --dry-run deploy
      # The form .github/workflows/deploy.yml runs, on the VM itself.
      - name: Deployed from the VM itself, no target connects anywhere
        run: |
          make --dry-run deploy DEPLOY_LOCAL=1 > "$RUNNER_TEMP/local-deploy.txt"
          # shellcheck disable=SC2016  # the "$HOME" is the recipe's own text
          grep --quiet -- '--chdir="$HOME" sh -c' "$RUNNER_TEMP/local-deploy.txt"
          ! grep --word-regexp ssh "$RUNNER_TEMP/local-deploy.txt"
      - name: Both compose variants resolve
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml config --quiet
      # What a YAML merge and an env_file add up to is Compose's to say, so it is asked:
      # the web app is on the edge network alone, and of api, relay and migrate only
      # migrate is handed the password of the owner role.
      - name: Compose keeps the web app off the core network and the owner password with migrate
        run: |
          for files in "--file compose.yaml" "--file compose.yaml --file compose.override.yaml"; do
            docker compose $files config --format json | jq --exit-status '
              (.services.web.networks | keys) == ["edge"]
              and (.services.nginx.networks | keys) == ["core", "edge"]
              and .services.api.environment.POSTGRES_PASSWORD == ""
              and .services.relay.environment.POSTGRES_PASSWORD == ""
              and (.services.migrate.environment.POSTGRES_PASSWORD | length) > 0' > /dev/null
          done
      # The VM's own file is made up here, by the command that creates the real one.
      - name: The production environment renders and compose.yaml resolves with it
        working-directory: backend
        run: |
          python3 -B -m scripts.production_env \
            --example ../.example.env --production ../infra/deploy/env.production \
            --own "$RUNNER_TEMP/own.env" --output "$RUNNER_TEMP/production.env" \
            --postgres-volume ci-has-no-database \
            --admins first.admin@ethz.ch,second.admin@ethz.ch
          docker compose --env-file "$RUNNER_TEMP/production.env" -f ../compose.yaml config --quiet
      # nginx's own verdict. A container of the stack's nginx image is handed what
      # Compose resolves for the nginx service, its environment and its mounts, renders
      # the templates as the stack does and tests the result. It has no network and
      # starts no server.
      - name: nginx accepts the proxy configuration of compose.yaml alone, with the overlay, and in production
        run: |
          nginx_test() {
            docker compose "$@" config --format json > "$RUNNER_TEMP/stack.json"
            jq --raw-output '.services.nginx.environment | to_entries[] | "\(.key)=\(.value)"' \
              "$RUNNER_TEMP/stack.json" > "$RUNNER_TEMP/nginx.env"
            set -- --rm --network none --env-file "$RUNNER_TEMP/nginx.env"
            while read -r mount; do
              set -- "$@" --volume "$mount:ro"
            done < <(jq --raw-output '.services.nginx.volumes[] | "\(.source):\(.target)"' "$RUNNER_TEMP/stack.json")
            docker run "$@" "$(jq --raw-output '.services.nginx.image' "$RUNNER_TEMP/stack.json")" nginx -t
          }
          nginx_test --file compose.yaml
          nginx_test --file compose.yaml --file compose.override.yaml
          nginx_test --env-file "$RUNNER_TEMP/production.env" --file compose.yaml

  # backend/openapi.json and the frontend's generated types are committed. This job
  # regenerates both and fails when the commit does not already contain the result.
  contract:
    name: API contract
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.x"
          working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create .env from the template
        run: cp .example.env .env
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Export the OpenAPI schema and regenerate the frontend types
        run: make api-client
      - name: Fail if the committed contract is stale
        run: |
          git add --all
          if ! git diff --cached --exit-code; then
            echo "::error::The API contract changed. Run 'make api-client' and commit the result."
            exit 1
          fi
