# openapi-typescript validates backend/openapi.json with Redocly before generating.
# FastAPI documents the event stream with `itemSchema`, an OpenAPI 3.2 keyword, in a
# 3.1 document, and the structural rule rejects it. The backend's contract tests own
# the document's validity, so that rule is off here.
#
# `extends` is written out because Redocly's own default set has further error-level
# rules. The two warnings switched off describe the document as it is meant to be: the
# API is served from the page's own origin, and nginx authenticates in front of it.
extends:
  - minimal
rules:
  struct: off
  no-empty-servers: off
  security-defined: off
